          type: string
          pattern: ^(TrioCooperationRtwTrajectConversation|TrioReintegrationStartNotificationConversation|TrioAbsenceReintegrationEvaluationConversation|TrioCooperationReintegrationEvaluationConversation|TrioReintegrationPlanProjectConversation|TrioCooperationReintegrationTrajectConversation|TrioReintegrationEndNotificationConversation|TrioAppealProcedureOutcomeConversation|TrioCooperationPreReturnToWorkVisitConversation|TrioCooperationMedicalForceMajeureProcedureConversation|TrioMedicalForceMajeureProcedureDecisionConversation|TrioMedicalForceMajeureProcedureDecisionConversation)$
          example: TrioCooperationRtwTrajectConversation
        self:
          type: string
          description: Absolute URI of this conversation. See commons-v1.yaml#/definitions/SelfLink.
          format: uri
          example: https://api.ehealth.fgov.be/trio/v1/conversations/de4dc192-5eda-418a-afd9-3a3ea73ae5a2
        id:
          $ref: '#/components/schemas/ConversationId'
        insuredPerson:
          description: InsuredPerson linked to this conversation.
          allOf:
            - $ref: '#/components/schemas/InsuredPersonRef'
        encryptionKey:
          type: object
          description: Pseudonymised AES key to use to encrypt/decrypt the subject and the message.
          allOf:
            - $ref: '#/components/schemas/EncryptionKeyRef'
        participants:
          type: object
          description: list all conversation participants
          allOf:
            - $ref: '#/components/schemas/ConversationParticipantsCollectionRef'
        read:
          type: boolean
          description: Flag indicating that the conversation has been read by the current actor
          example: true
        actionExpected:
          type: boolean
          description: flag indicating that an action is expected for the current actor
          example: false
        watch:
          type: boolean
          description: flag indicating that the conversation is visible in the current actor's overview
          example: true
        consent:
          type: boolean
          description: |-
            flag indicating the consent status.
            ## Business rules: - When set to *false*, no more messages or attachments can be added to this conversation.
        lastMessageBy:
          description: Actor's information of tha last message in the conversation
          allOf:
            - $ref: '#/components/schemas/ActorRef'
        lastMessageAt:
          description: Instant on which this dossier has been created.
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        permissions:
          type: object
          description: Requester's permissions and restrictions applicable on this conversation
          allOf:
            - $ref: '#/components/schemas/ConversationPermissionsRef'
        embedded:
          $ref: '#/components/schemas/Embedded'
        traject:
          description: Traject linked to the conversation.
          allOf:
            - $ref: '#/components/schemas/TrajectRef'
      required:
        - actionExpected
        - consent
        - encryptionKey
        - id
        - insuredPerson
        - lastMessageAt
        - lastMessageBy
        - objectType
        - participants
        - permissions
        - read
        - self
        - traject
        - watch
    TrajectConversationForCreation:
      type: object
      properties:
        objectType:
          description: Type of this object.
          type: string
          pattern: ^(TrioCooperationRtwTrajectConversation|TrioReintegrationStartNotificationConversation|TrioAbsenceReintegrationEvaluationConversation|TrioCooperationReintegrationEvaluationConversation|TrioReintegrationPlanProjectConversation|TrioCooperationReintegrationTrajectConversation|TrioReintegrationEndNotificationConversation|TrioAppealProcedureOutcomeConversation|TrioCooperationPreReturnToWorkVisitConversation|TrioCooperationMedicalForceMajeureProcedureConversation|TrioMedicalForceMajeureProcedureDecisionConversation|TrioMedicalForceMajeureProcedureDecisionConversation)$
          example: TrioCooperationRtwTrajectConversation
        encryptionKey:
