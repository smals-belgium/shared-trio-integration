    ActorId:
      type: string
      description: |
        Identifier of an actor.
        An actor can be identified either by:
        * __NIHDI number__ of a generalPractitioner : nihdiNumber:12345678
        * __ENTERPRISE number__ of an organization : enterpriseNumber:0123456789
        * technical __ID __  : id:d74ef6fb-e6ca-4fb3-9577-e831164f307a
      pattern: ^(nihdiNumber|enterpriseNumber|id):(.*)$
      example: nihdiNumber:12345678
    ActorIdRef:
      type: string
      description: |
        Identifier reference for an actor.
        An actor can be referenced either by:
        * __NIHDI number__ of a generalPractitioner : nihdiNumber:12345678
        * __ENTERPRISE number__ of an organization : enterpriseNumber:0123456789
        * technical __ID __  : id:d74ef6fb-e6ca-4fb3-9577-e831164f307a
        * __GMD Holder__ of an insuredPerson : gmdHolder
      pattern: ^((nihdiNumber|enterpriseNumber|id):(.*)|gmdHolder)$
      example: nihdiNumber:12345678
    ActorRef:
      type: object
      properties:
        href:
          description: URI of this user. Based on eHealth commons-v1.yaml#/definitions/SelfLink.
          type: string
          format: uri
          example: https://api.ehealth.fgov.be/trio/v1/actors/nihdiNumber:12345678
        id:
          $ref: '#/components/schemas/ActorIdRef'
      required:
        - href
        - id
