          description: External services responsible for this traject.
          allOf:
            - $ref: '#/components/schemas/ActorsCollectionRef'
          example:
            href: urn:traject:de4dc192-5eda-418a-afd9-3a3ea73ae5a2:externalServices
        permissions:
          type: object
          description: Requester's permissions and restrictions applicable on this traject
          allOf:
            - $ref: '#/components/schemas/TrajectPermissionsRef'
        updatedAt:
          description: Instant on which the traject was updated.
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        updatedBy:
          description: Actor that updated this traject for the last time.
          allOf:
            - $ref: '#/components/schemas/ActorRef'
        embedded:
          $ref: '#/components/schemas/Embedded'
        status:
          type: string
          enum:
            - ended
            - endedConsent
            - ongoing
            - ongoingReintegration
            - wdContact
        startDateHdi:
          type: string
          description: The startDateHdi MUST be greater or equal to startDate.
          format: date
          example: '2025-12-15'
      required:
        - attachments
        - consents
        - conversations
        - dossier
        - encryptionKey
        - externalServices
        - id
        - objectType
        - permissions
        - self
        - startDate
        - status
        - updatedAt
        - updatedBy
    TrioRtwHdiTrajectForCreation:
      type: object
      description: AMI TRIO traject.
      properties:
        objectType:
          description: Type of this object.
          type: string
          pattern: ^TrioRtwHdiTraject$
          example: TrioRtwHdiTraject
        dossier:
          description: Dossier linked to this traject.
          allOf:
            - $ref: '#/components/schemas/DossierRefForCreation'
        startDate:
          type: string
          description: Date this traject started.
          format: date
          example: '2025-12-15'
        endDate:
          type: string
          description: Date this traject ended, or empty if the traject is still open. The endDate MUST be greater or equal
            to startDateHdi.
          format: date
          example: '2025-12-15'
        consents:
          description: List of consents applicable to the current user. true when the insured person has given his consent
            for the exchange of data as part of this traject. The user or organization must have proof of the consent.
          type: object
          additionalProperties:
            type: boolean
        status:
          type: string
          enum:
            - ended
            - endedConsent
            - ongoing
            - ongoingReintegration
            - wdContact
        startDateHdi:
          type: string
          description: The startDateHdi MUST be greater or equal to startDate.
          format: date
          example: '2025-12-15'
      required:
        - consents
        - dossier
        - objectType
        - startDate
        - status
    TrioRtwHdiTrajectForUpdate:
      type: object
      description: AMI TRIO traject.
      properties:
        objectType:
          description: Type of this object.
          type: string
          pattern: ^TrioRtwHdiTraject$
          example: TrioRtwHdiTraject
        startDate:
          type: string
          description: Date this traject started.
          format: date
          example: '2025-12-15'
        endDate:
          type: string
          description: Date this traject ended, or empty if the traject is still open. The endDate MUST be greater or equal
            to startDateHdi.
          format: date
          example: '2025-12-15'
          nullable: true
        consents:
          description: |-
            List of consents applicable to the current user.
            ## Business rules: - When set to *false*, consent will be revoked for all applicable conversations initiated by the user's organization.
          type: object
          additionalProperties:
            type: boolean
        status:
          type: string
          enum:
            - ended
            - endedConsent
            - ongoing
            - ongoingReintegration
            - wdContact
        startDateHdi:
          type: string
          description: The startDateHdi MUST be greater or equal to startDate.
          format: date
          example: '2025-12-15'
          nullable: true
      required:
        - objectType
    User:
      type: object
      properties:
        objectType:
          description: Type of this object.
          type: string
          pattern: ^(EsAdministrativeTeamMember|EsWorkNurse|EsWorkDoctor|GeneralPractitioner|HioAdministrativeTeamMember|HioAdvisingDoctor|HioMultidisciplinaryTeamMember|HioReturnToWorkCoordinator)$
          example: GeneralPractitioner
        self:
          description: URI of this user. Based on eHealth commons-v1.yaml#/definitions/SelfLink.
          type: string
          format: uri
          example: https://api.ehealth.fgov.be/trio/v1/actors/nihdiNumber:12345678
        id:
          description: Identifier of the user. A user is identified either by it's nihdi number when applicable or technicalId
          type: string
          pattern: ^((nihdiNumber|id):(.*)|gmdHolder)$
          example: nihdiNumber:12345678
        givenName:
          description: First name of the user.
          type: string
          example: Marcel
        familyName:
          description: Last name of the user.
          type: string
          example: Dupont
        hidden:
          description: Indicate if the actor has been hidden/disabled
          type: boolean
          example: true
        organization:
          description: Reference of the organization linked to this user. Only defined if the user is linked to an organization.
          allOf:
            - $ref: '#/components/schemas/OrganizationRef'
        embedded:
          $ref: '#/components/schemas/Embedded'
      required:
        - familyName
        - givenName
        - hidden
        - id
        - objectType
        - self
    UserForUpdate:
      type: object
      properties:
        hidden:
          description: Indicate if the actor has been hidden/disabled
          type: boolean
          example: true
      required:
        - hidden
