    DossierAttachment:
      type: object
      description: |-
        Attachment of a dossier.

        **TrioApplicationCodexDossierAttachment**

        Demand completed by the general practitioner (or employee or employer) to give to the work doctor to start a CODEX traject.

        **TrioHealthInformationEmploymentPotentialDossierAttachment**

        Document containing information about the health status of the individual concerned, within the framework of assessing that individual’s work capacity.

        **TrioMedicalReportDossierAttachment**

        Document that contains information on the medical condition of an insured person.
      properties:
        objectType:
          description: Type of attachment.
          type: string
          pattern: ^(TrioEvaluationIncapacityWorkDossierAttachment|TrioMedicalReportDossierAttachment|TrioInformationIncapacityWorkDossierAttachment|TrioConsentDossierAttachment|TrioEmploymentPotentialDossierAttachment|TrioQuestionnaireDossierAttachment|TrioApplicationCodexDossierAttachment|TrioInformationRtwFundDossierAttachment|TrioInformationProfessionalProjectDossierAttachment|TrioHealthInformationEmploymentPotentialDossierAttachment)$
        self:
          description: URI of this attachment. See commons-v1.yaml#/definitions/SelfLink.
          type: string
          format: uri
          example: https://api.ehealth.fgov.be/trio/v1/attachments/02ac8604-9c34-4f17-8047-291553dc1082
        id:
          allOf:
            - $ref: '#/components/schemas/AttachmentId'
        name:
          description: A Base-64 encoded string representation containing the encrypted attachment name.
          type: string
          format: byte
        sharedWith:
          description: List sharing criterias.
          type: array
          items:
            $ref: '#/components/schemas/AttachmentShareCriteria'
        createdAt:
          description: Instant on which the attachment was created.
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        createdBy:
          description: Actor that created this attachment
          allOf:
            - $ref: '#/components/schemas/ActorRef'
        updatedAt:
          description: Instant on which the attachment was updated.
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        updatedBy:
          description: Actor that updated this attachment for the last time.
          allOf:
            - $ref: '#/components/schemas/ActorRef'
        encryptionKey:
          allOf:
            - $ref: '#/components/schemas/EncryptionKeyRef'
        permissions:
          type: object
          description: Requester's permissions and restrictions applicable on this attachment
          allOf:
            - $ref: '#/components/schemas/AttachmentPermissionsRef'
        embedded:
          $ref: '#/components/schemas/Embedded'
      required:
        - createdAt
        - createdBy
        - encryptionKey
        - id
        - name
        - objectType
        - permissions
        - self
        - sharedWith
        - updatedAt
        - updatedBy
