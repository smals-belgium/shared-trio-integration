          example: https://api.ehealth.fgov.be/trio/v1/actors/enterpriseNumber:0123456789
          type: string
          format: uri
        id:
          description: Identifier of the organization.
          type: string
          pattern: ^(enterpriseNumber|id):(.*)$
          example: enterpriseNumber:0123456789
        name:
          description: Localized name of the organization
          allOf:
            - $ref: '#/components/schemas/LocalizedString'
        embedded:
          $ref: '#/components/schemas/Embedded'
      required:
        - id
        - name
        - objectType
        - self
    OrganizationRef:
      type: object
      properties:
        href:
          description: URI of the organization. Based on eHealth commons-v1.yaml#/definitions/HttpLink.
          example: https://api.ehealth.fgov.be/trio/v1/actors/enterpriseNumber:0123456789
          type: string
          format: uri
        id:
          description: Identifier of the organization.
          type: string
          pattern: ^(enterpriseNumber|id):(.*)$
          example: enterpriseNumber:0123456789
      required:
        - href
        - id
    Page:
      description: Page number (1-based).
      type: integer
      minimum: 1
      example: 1
    PageSize:
      description: Number of element in a page.
      type: integer
      minimum: 0
      maximum: 100
      example: 25
    Problem:
      description: A Problem Details object (RFC 7807)
      type: object
      properties:
        type:
          type: string
          format: uri
          description: An absolute URI that identifies the problem type
          default: about:blank
        href:
          type: string
          format: uri
          description: An absolute URI that, when dereferenced, provides human-readable documentation for the problem type
            (e.g. using HTML).
        title:
          type: string
          description: A short summary of the problem type. Written in English and readable for engineers (usually not suited
            for non technical stakeholders and not localized).
          example: Service Unavailable
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
          example: 503
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem
        instance:
          type: string
          format: uri
          description: An absolute URI that identifies the specific occurrence of the problem. It may or may not yield further
            information if dereferenced.
      example:
        type: urn:problem-type:belgif:payloadTooLarge
        href: https://www.belgif.be/specification/rest/api-guide/problems/payloadTooLarge.html
        title: Payload Too Large
        status: 413
        detail: Request message must not be larger than 10 MB
        instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
        limit: 10485760
    PseudonymisedValue:
      type: string
      description: A pseudonimysed value. It contains the Base64 URL encoded (without padding) ASN.1 representation of the
        pseudonym, followed by the transit info (both separated by a colon (:)
      pattern: ^([A-Za-z0-9-_]+):(e[yw][A-Za-z0-9-_]+\.(?:e[yw][A-Za-z0-9-_]+)?\.[A-Za-z0-9-_]{2,}(?:(?:\.[A-Za-z0-9-_]{2,}){2})?)$
    Timestamp:
      type: string
      description: A date time in ISO 8601 format with offset.
      format: date-time
      example: '2025-11-13T10:30:00+01:00'
    TrajectAttachment:
      type: object
      description: |-
        Attachment of a traject.

        Types of attachment (determined by the property `objectType`):

        **TrioAccReintegrationPlanCodexTrajectAttachment**

        A reintegration plan that has been signed and approved by the insured person.

        **TrioActionsConclusionsTrajectAttachment**

        Actions and conclusions after first interview with the insured person by the RTWC, before the actual ZIV traject is started.

        **TrioDecisionAppealDecisionBTrajectAttachment**

        When a decision B is taken by the work doctor, the insured person can ask for appeal.
        After the appeal a final decision has to be taken.

        **TrioEngagementStatementTrajectAttachment**

        Document that is signed by the insured person to confirm his engagement to follow a ZIV traject.

        **TrioFollowupInterviewTrajectAttachment**

        Document that contains information on the follow-up that is done during a ZIV traject.

        **TrioHealthAssessmentFormTrajectAttachment**

        A health assessment form contains the information gathered by the work doctor on the health condition of the insured person during an official visit before return to work.

        **TrioHealthAssessmentFormDefinitelyTrajectAttachment**

        Medical report attachment for a traject.

        **TrioHealthAssessmentFormNotDefinitelyTrajectAttachment**

        Medical report attachment for a traject.

        **TrioMedicalReportTrajectAttachment**

        Document that contains information on the medical condition of an insured person.

        **TrioMotivatedReportTrajectAttachment**

        When a decision A or B is taken but the employer indicates there is no possibility to give the insured person other or adapted work, the employer has to provide a motivation why it is not possible.

        **TrioReintegrationAssessmentTrajectAttachment**

        Document that contains the decision that is taken during a CODEX traject by a work doctor.

        Possible decisions:

        - A: insured person can eventually return to work (if modification to the content or working conditions is done)
        - B: insured person cannot return to work
        - C: it is not yet possible to take a decision

        **TrioReintegrationPlanDefinitionTrajectAttachment**

        Based on the decision CODEX that is taken a preliminary reintegration plan (with steps that insured person can take in his return to work) can be set up.
        This preliminary reintegration plan first has to be confirmed by the advising doctor of the IO to be sure that the health conditions of the insured person allow a (partial) return to work.

        **TrioReintegrationPlanHdiTrajectAttachment**

        Document that contains information on the steps that can be taken by the insured person to be able to return to work.
        Document provided by the insurance organism.

        **TrioRefReintegrationPlanCodexTrajectAttachment**

        A reintegration plan that has been signed and refused by the insured person.

        **TrioTermsConditionsFormTrajectAttachment**

        Terms conditions attachment for a traject.
      properties:
        objectType:
          description: Type of attachment.
          type: string
          pattern: ^(TrioMedicalReportTrajectAttachment|TrioConsentTrajectAttachment|TrioHealthInformationReintegrationAssessmentTrajectAttachment|TrioStartReintegrationTrajectAttachment|TrioAbsenceReintegrationAssessmentTrajectAttachment|TrioEndReintegrationTrajectAttachment|TrioReintegrationAssessmentTrajectAttachment|TrioDecisionAppealDecisionTrajectAttachment|TrioDecisionAppealDecisionBTrajectAttachment|TrioReintegrationPlanDefinitionTrajectAttachment|TrioAccReintegrationPlanCodexTrajectAttachment|TrioRefReintegrationPlanCodexTrajectAttachment|TrioMotivatedReportTrajectAttachment|TrioHealthInformationPreReturnToWorkVisitTrajectAttachment|TrioHealthInformationMedicalForceMajeureTrajectAttachment|TrioHealthAssessmentFormNotDefinitelyTrajectAttachment|TrioHealthAssessmentFormDefinitelyTrajectAttachment|TrioTermsConditionsFormTrajectAttachment|TrioInformationHdiTrajectAttachment|TrioActionsConclusionsTrajectAttachment|TrioReintegrationPlanHdiTrajectAttachment|TrioEngagementStatementTrajectAttachment|TrioFollowupInterviewTrajectAttachment)$
        self:
          description: URI of this attachment. See commons-v1.yaml#/definitions/SelfLink.
          type: string
          format: uri
          example: https://api.ehealth.fgov.be/trio/v1/attachments/02ac8604-9c34-4f17-8047-291553dc1082
        id:
          allOf:
            - $ref: '#/components/schemas/AttachmentId'
        name:
          description: A Base-64 encoded string representation containing the encrypted attachment name.
          type: string
          format: byte
        sharedWith:
          description: List sharing criterias.
          type: array
          items:
            $ref: '#/components/schemas/AttachmentShareCriteria'
        createdAt:
          description: Instant on which the attachment was created.
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        createdBy:
          description: Actor that created this attachment
          allOf:
            - $ref: '#/components/schemas/ActorRef'
        updatedAt:
          description: Instant on which the attachment was updated.
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        updatedBy:
          description: Actor that updated this attachment for the last time.
          allOf:
            - $ref: '#/components/schemas/ActorRef'
        encryptionKey:
          allOf:
            - $ref: '#/components/schemas/EncryptionKeyRef'
        permissions:
          type: object
          description: Requester's permissions and restrictions applicable on this attachment
          allOf:
            - $ref: '#/components/schemas/AttachmentPermissionsRef'
        embedded:
          $ref: '#/components/schemas/Embedded'
        traject:
          description: Traject this attachment is linked to.
          allOf:
            - $ref: '#/components/schemas/TrajectRef'
      required:
        - createdAt
        - createdBy
        - encryptionKey
        - id
        - name
        - objectType
        - permissions
        - self
        - sharedWith
        - traject
        - updatedAt
        - updatedBy
