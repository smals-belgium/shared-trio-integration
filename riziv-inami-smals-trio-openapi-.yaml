openapi: 3.0.3
info:
  title: TRIO API
  description: REST API of TRIO
  version: 0.1
  contact:
    name: eHealth Platform Belgium
    email: info@ehealth.fgov.be
security:
  - Oauth2:
      - esAdministrativeTeamMember
      - esWorkDoctor
      - esWorkNurse
      - hioAdministrativeTeamMember
      - hioAdvisingDoctor
      - hioMultidisciplinaryTeamMember
      - hioReturnToWorkCoordinator
x-oauth2-required-scopes: any
tags:
  - name: Actors
  - name: Attachments
  - name: Conversations
  - name: Dossiers
  - name: Dossiers owners
  - name: Employers
  - name: Encryption keys
  - name: Insured persons
  - name: Monitoring
  - name: Trajects
paths:
  /actors:
    parameters:
      - $ref: '#/components/parameters/BelGovTraceId'
      - $ref: '#/components/parameters/TrioOrganizationId'
    get:
      tags:
        - Actors
      operationId: listActors
      summary: List all actors
      description: List all actors for a given organization. If `organization.id` parameter is not provided, return the actors
        for the requester's organization.
      parameters:
        - name: embed
          description: Resources to embed in the response.
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^(?:items|items\(organization\))$
            uniqueItems: true
          examples:
            items:
              value:
                - items
              description: Embed the actors.
            items(organization):
              value:
                - items(organization)
              description: Embed the actors and the organizations linked to the actors.
        - name: organization.id
          description: actor id of the organization
          in: query
          required: false
          schema:
            type: string
            pattern: ^(enterpriseNumber):(.*)$
          examples:
            enterpriseNumber:
              value: enterpriseNumber:0409122442
        - name: objectType
          description: actor type (persons only) to filter
          in: query
          required: false
          schema:
            type: string
            pattern: ^(EsAdministrativeTeamMember|EsWorkNurse|EsWorkDoctor|GeneralPractitioner|HioAdministrativeTeamMember|HioAdvisingDoctor|HioMultidisciplinaryTeamMember|HioReturnToWorkCoordinator)$
          examples:
            EsAdministrativeTeamMember:
              value: EsAdministrativeTeamMember
            EsWorkNurse:
              value: EsWorkNurse
            EsWorkDoctor:
              value: EsWorkDoctor
            GeneralPractitioner:
              value: GeneralPractitioner
            HioAdministrativeTeamMember:
              value: HioAdministrativeTeamMember
            HioAdvisingDoctor:
              value: HioAdvisingDoctor
            HioMultidisciplinaryTeamMember:
              value: HioMultidisciplinaryTeamMember
            HioReturnToWorkCoordinator:
              value: HioReturnToWorkCoordinator
        - name: name
          description: Filter on family name and given name
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A collection of actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorsCollection'
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /actors/{actorId}:
    parameters:
      - $ref: '#/components/parameters/BelGovTraceId'
      - $ref: '#/components/parameters/TrioOrganizationId'
      - $ref: '#/components/parameters/ActorId'
    get:
      tags:
        - Actors
      operationId: getActor
      summary: Get an actor
      description: Get an actor by its identifier.
      parameters:
        - name: embed
          description: Resources to embed in the response.
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^(?:organization)$
            uniqueItems: true
          examples:
            items:
              description: Embed the actor's organization.
              value:
                - organization
      responses:
        '200':
          description: Actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        default:
          $ref: '#/components/responses/ProblemResponse'
    patch:
      tags:
        - Actors
      operationId: updateActor
      summary: update an actor
      description: update an actor in requester organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserForUpdate'
      responses:
        '200':
          description: A conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /attachments:
    parameters:
      - $ref: '#/components/parameters/BelGovTraceId'
      - $ref: '#/components/parameters/TrioOrganizationId'
    get:
      tags:
        - Attachments
      operationId: searchAttachments
      summary: Search for the attachments of a dossier or a traject
      description: '`dossierId` and `trajectId` are mutually exclusive: using both will return an error'
      parameters:
        - $ref: '#/components/parameters/DossierIdQuery'
        - $ref: '#/components/parameters/TrajectIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          description: Sorting properties. Use '-' as prefix to reverse the sorting
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^-?(?:createdBy)$
            uniqueItems: true
          examples:
            createdBy:
              description: sort by creation timestamp
              value:
                - createdBy
        - name: embed
          description: Resources to embed.
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^(?:items|items\((?:dossier|traject|createdBy|createdBy\(organization\)|encryptionKey|permissions|sharedWith|updatedBy|updatedBy\(organization\))\))$
            uniqueItems: true
          examples:
            items:
              description: Embed attachments.
              value:
                - items
            items(createdBy):
              description: Embed the actor that create the attachment.
              value:
                - items(createdBy)
            items(sharedWith):
              description: Embed the list of actors that have access to the attachment.
              value:
                - items(sharedWith)
            items(encryptionKey):
              description: Embed the encryption key to use to encrypt/decrypt sensitive/medical information for all the sub-resources
                of the dossier.
              value:
                - items(encryptionKey)
            items(updatedBy):
              description: Embed the actor that did the last update of the attachment.
              value:
                - items(updatedBy)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentsCollection'
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags:
        - Attachments
      operationId: createAttachment
      summary: Create a new attachment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnyAttachmentForCreation'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyAttachment'
          headers:
            Location:
              $ref: '#/components/headers/Location'
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/BelGovTraceId'
      - $ref: '#/components/parameters/TrioOrganizationId'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      tags:
        - Attachments
      operationId: consultAttachment
      summary: Consult or Download an attachment
      parameters:
        - name: embed
          description: Resources to embed.
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^(?:creator|encryptionKey|createdBy|createdBy\(organization\)|sharedWith|sharedWith\(items\)|updatedBy|updatedBy\(organization\))$
            uniqueItems: true
          examples:
            creator:
              description: Embed the actor that create the attachment.
              value:
                - creator
            encryptionKey:
              description: Embed the encryptionKey.
              value:
                - encryptionKey
            sharedWith:
              description: Embed the list of actors that have access to the attachment.
              value:
                - sharedWith
            sharedWith(items):
              description: Embed the list of actors details that have access to the attachment.
              value:
                - sharedWith(items)
            updatedBy:
              description: Embed the actor that did the last update of the attachment.
              value:
                - updatedBy
      responses:
        '200':
          description: Attachment file (application/octet-stream) or metadata (application/json)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyAttachment'
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags:
        - Attachments
      operationId: uploadAttachment
      summary: Upload the attachment file
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Attachment uploaded
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
    patch:
      tags:
        - Attachments
      operationId: updateAttachment
      summary: Update an attachment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnyAttachmentForUpdate'
      responses:
        '200':
          description: Traject updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyAttachment'
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags:
        - Attachments
      operationId: deleteAttachment
      summary: Delete an attachment
      responses:
        '204':
          description: No Content
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /conversations:
    parameters:
      - $ref: '#/components/parameters/BelGovTraceId'
      - $ref: '#/components/parameters/TrioOrganizationId'
    get:
      tags:
        - Conversations
      operationId: searchConversations
      summary: Search for conversations for a given participant
      description: |
        `dossier.id`, `traject.id` and `message.id` are mutually exclusive: using more than one will return an error.

        `lastMessageBy.id` and `lastMessageBy.id.not` are not allowed with `message.id`.
      parameters:
        - name: participant.id
          description: Participant id to filter on. If not provided, default to current user
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ActorIdRef'
          example: enterpriseNumber:0409122442
        - $ref: '#/components/parameters/DossierIdQuery'
        - $ref: '#/components/parameters/TrajectIdQuery'
        - name: objectType
          description: Filter on the conversation type.
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^(TrioEvaluationIncapacityWorkConversation|TrioQuestionIncapacityWorkConversation|TrioWorkPotentialConversation|TrioReintegrationStartRequestConversation|TrioEvaluationHealthStatusConversation|TrioQuestionRtwFundConversation|TrioQuestionVocationalTrainingProjectConversation|TrioCooperationRtwTrajectConversation|TrioReintegrationStartNotificationConversation|TrioAbsenceReintegrationEvaluationConversation|TrioCooperationReintegrationEvaluationConversation|TrioReintegrationPlanProjectConversation|TrioCooperationReintegrationTrajectConversation|TrioReintegrationEndNotificationConversation|TrioAppealProcedureOutcomeConversation|TrioCooperationPreReturnToWorkVisitConversation|TrioCooperationMedicalForceMajeureProcedureConversation|TrioMedicalForceMajeureProcedureDecisionConversation|TrioMedicalForceMajeureProcedureDecisionConversation)$
            uniqueItems: true
          example:
            - TrioEvaluationIncapacityWorkConversation
        - name: message.id
          description: Conversation message to filter on.
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ConversationMessageId'
          example: 84031082-8d3c-485a-9bc9-ab895046c768
        - name: read
          description: Filter on the participant read status.
          in: query
          required: false
          schema:
            type: boolean
          example: true
        - name: actionExpected
          description: Filter on the participant actionExpected status.
          in: query
          required: false
          schema:
            type: boolean
          example: true
        - name: lastMessageAt.from
          description: Filter out any conversations where the lastMessageAt is before this parameter
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Date'
        - name: lastMessageAt.to
          description: Filter out any conversations where the lastMessageAt is after this parameter
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Date'
        - name: lastMessageBy.id
          description: Filter on the actor that sent the last message inside the conversation
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ActorId'
          example: enterpriseNumber:0123456789
        - name: lastMessageBy.id.not
          description: Filter on the actor that sent the last message inside the conversation, which should be different from
            the provided id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ActorId'
          example: enterpriseNumber:0123456789
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          description: Sorting properties. Use '-' as prefix to reverse the sorting
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^-?(lastMessageAt)$
            uniqueItems: true
          examples:
            lastMessageAt:
              description: Sort by last message timestamp
              value:
                - lastMessageAt
        - name: embed
          description: Resources to embed.
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^(?:items|items\((?:attachments|attachments\(items\)|dossier|encryptionKey|traject|insuredPerson|lastMessageBy|createdBy|createdBy\(organization\)|participants|participants\(items\)|participants\(items\(actor\)\)|participants\(items\(employers\)\)|participants\(items\(employers\(items\)\)\)|permissions)\))$
            uniqueItems: true
          examples:
            items:
              description: Embed the conversations.
              value:
                - items
            items(dossier):
              description: Embed the dossiers linked to the conversations.
              value:
                - items
                - items(dossier)
            items(encryptionKey):
              description: Embed the encryptionKey.
              value:
                - items
                - items(encryptionKey)
            items(traject):
              description: Embed the trajects linked to the conversations.
              value:
                - items
                - items(traject)
            items(insuredPerson):
              description: Embed the insuredPerson linked to the conversations.
              value:
                - items
                - items(insuredPerson)
            items(participants),items(participants(items)):
              description: Embed the participants of the conversations.
              value:
                - items
                - items(participants)
                - items(participants(items))
            ? items(participants),items(participants(items)),items(participants(items(employers))),items(participants(items(employers(items))))
              : description: Embed the employers managed by the conversation participants
                value:
                  - items
                  - items(participants)
                  - items(participants(items))
                  - items(participants(items(employers)))
                  - items(participants(items(employers(items))))
            items(dossier),items(traject):
              description: Embed the conversations and the dossiers or the trajects linked to it.
              value:
                - items
                - items(dossier)
                - items(traject)
      responses:
        '200':
          description: Conversations matching the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationsCollection'
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags:
        - Conversations
      operationId: createConversation
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnyConversationForCreation'
      responses:
        '201':
          description: The created conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyConversation'
          headers:
            Location:
              $ref: '#/components/headers/Location'
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/BelGovTraceId'
      - $ref: '#/components/parameters/TrioOrganizationId'
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags:
        - Conversations
      operationId: consultConversation
      summary: Consult a conversation
      parameters:
        - name: embed
          description: Resources to embed.
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^(?:attachments|attachments\(items\)|dossier|encryptionKey|traject|insuredPerson|lastMessageBy|createdBy|createdBy\(organization\)|participants|participants\(items\)|participants\(items\(actor\)\)|participants\(items\(employers\)\)|participants\(items\(employers\(items\)\)\)|permissions)$
            uniqueItems: true
          examples:
            encryptionKey:
              description: Embed the encryptionKey.
              value:
                - encryptionKey
            dossier:
              description: Embed the dossier linked to the conversation.
              value:
                - dossier
            traject:
              description: Embed the traject linked to the conversation.
              value:
                - traject
            insuredPerson:
              description: Embed the insuredPerson linked to the conversation.
              value:
                - insuredPerson
            participants,participants(items):
              description: Embed the participants of the conversations.
              value:
                - participants
                - participants(items)
            dossier,traject:
              description: Embed the dossier or the traject (depending if it is a Conversation or a TrajectConversation) linked
                to the conversation.
              value:
                - dossier
                - traject
      responses:
        '200':
          description: A conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyConversation'
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
    patch:
      tags:
        - Conversations
      operationId: updateConversation
      summary: update a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnyConversationForUpdate'
      responses:
        '200':
          description: Conversation updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyConversation'
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/BelGovTraceId'
      - $ref: '#/components/parameters/TrioOrganizationId'
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags:
        - Conversations
      operationId: consultConversationMessages
      summary: consult all messages inside an existing conversation
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          description: Sorting properties. Use '-' as prefix to reverse the sorting
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^-?(createdAt)$
            uniqueItems: true
          examples:
            createdAt:
              description: Sort by last message creation timestamp
              value:
                - createdAt
        - name: embed
          description: Resources to embed.
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^(?:items|items\((?:attachments|attachments\(items\)|attachments\(items\(encryptionKey\)\)|attachments\(items\(permissions\)\)|createdBy|createdBy\(organization\)|conversation|conversation\(encryptionKey\))\))$
            uniqueItems: true
          examples:
            items:
              description: Embed the conversations.
              value:
                - items
            items(attachments), items(attachments(items)):
              description: Embed the attachments linked to the message.
              value:
                - items(attachments)
                - items(attachments(items))
            items(createdBy):
              description: embed the actor that create the message
              value:
                - items(createdBy)
            items(conversation):
              description: embed the parent conversation
              value:
                - items(conversation)
      responses:
        '200':
          description: A page of conversation messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessagesCollection'
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags:
        - Conversations
      operationId: addMessage
      summary: add a new message to an existing conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationMessageForCreation'
      responses:
        '201':
          description: A conversation message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessage'
          headers:
            Location:
              $ref: '#/components/headers/Location'
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /conversations/{conversationId}/participants:
    parameters:
      - $ref: '#/components/parameters/BelGovTraceId'
      - $ref: '#/components/parameters/TrioOrganizationId'
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags:
        - Conversations
      operationId: consultConversationParticipants
      summary: consult all participants of an existing conversation
      parameters:
        - name: embed
          description: Resources to embed.
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^(?:items|items\((?:actor)\))$
            uniqueItems: true
          examples:
            items:
              description: Embed the participants.
              value:
                - items
            items(actors):
              description: Embed the actors linked to this participant.
              value:
                - items(actor)
      responses:
        '200':
          description: A collection of conversation participants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationParticipantsCollection'
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /conversations/{conversationId}/participants/{actorId}:
    parameters:
      - $ref: '#/components/parameters/BelGovTraceId'
      - $ref: '#/components/parameters/TrioOrganizationId'
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/ActorId'
    get:
      tags:
        - Conversations
      operationId: consultConversationParticipant
      summary: consult a specific conversation participant
      parameters:
        - name: embed
          description: Resources to embed.
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^(?:actor)$
            uniqueItems: true
          examples:
            actor:
              description: Embed the participant actor .
              value:
                - actor
      responses:
        '200':
          description: A collection of conversation participants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationParticipant'
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
    patch:
      tags:
        - Conversations
      operationId: updateConversationParticipant
      summary: update a conversation participant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationParticipantForUpdate'
      responses:
        '200':
          description: conversation participant updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationParticipant'
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /currentUser:
    parameters:
      - $ref: '#/components/parameters/BelGovTraceId'
      - $ref: '#/components/parameters/TrioOrganizationId'
    get:
      tags:
        - Actors
      operationId: getMe
      summary: Get current requester
      description: Consult current requester detail
      parameters:
        - name: embed
          description: Resources to embed in the response.
          in: query
          required: false
