          pattern: ^(TrioCooperationRtwTrajectConversation|TrioReintegrationStartNotificationConversation|TrioAbsenceReintegrationEvaluationConversation|TrioCooperationReintegrationEvaluationConversation|TrioReintegrationPlanProjectConversation|TrioCooperationReintegrationTrajectConversation|TrioReintegrationEndNotificationConversation|TrioAppealProcedureOutcomeConversation|TrioCooperationPreReturnToWorkVisitConversation|TrioCooperationMedicalForceMajeureProcedureConversation|TrioMedicalForceMajeureProcedureDecisionConversation|TrioMedicalForceMajeureProcedureDecisionConversation)$
