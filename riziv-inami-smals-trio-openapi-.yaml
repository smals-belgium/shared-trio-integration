    DossierConversation:
      type: object
      properties:
        objectType:
          description: Type of this object.
          type: string
          pattern: ^(TrioEvaluationIncapacityWorkConversation|TrioQuestionIncapacityWorkConversation|TrioWorkPotentialConversation|TrioReintegrationStartRequestConversation|TrioEvaluationHealthStatusConversation|TrioQuestionRtwFundConversation|TrioQuestionVocationalTrainingProjectConversation)$
          example: TrioEvaluationIncapacityWorkConversation
        self:
          type: string
          description: Absolute URI of this conversation. See commons-v1.yaml#/definitions/SelfLink.
          format: uri
          example: https://api.ehealth.fgov.be/trio/v1/conversations/de4dc192-5eda-418a-afd9-3a3ea73ae5a2
        id:
          $ref: '#/components/schemas/ConversationId'
        insuredPerson:
          description: InsuredPerson linked to this conversation.
          allOf:
            - $ref: '#/components/schemas/InsuredPersonRef'
        encryptionKey:
          type: object
          description: Pseudonymised AES key to use to encrypt/decrypt the subject and the message.
          allOf:
            - $ref: '#/components/schemas/EncryptionKeyRef'
        participants:
          type: object
          description: list all conversation participants
          allOf:
            - $ref: '#/components/schemas/ConversationParticipantsCollectionRef'
        read:
          type: boolean
          description: Flag indicating that the conversation has been read by the current actor
          example: true
        actionExpected:
          type: boolean
          description: flag indicating that an action is expected for the current actor
          example: false
        watch:
          type: boolean
          description: flag indicating that the conversation is visible in the current actor's overview
          example: true
        consent:
          type: boolean
          description: |-
            flag indicating the consent status.
            ## Business rules: - When set to *false*, no more messages or attachments can be added to this conversation.
        lastMessageBy:
          description: Actor's information of tha last message in the conversation
          allOf:
            - $ref: '#/components/schemas/ActorRef'
        lastMessageAt:
          description: Instant on which this dossier has been created.
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        permissions:
          type: object
          description: Requester's permissions and restrictions applicable on this conversation
          allOf:
            - $ref: '#/components/schemas/ConversationPermissionsRef'
        embedded:
          $ref: '#/components/schemas/Embedded'
        dossier:
          description: Dossier linked to this conversation.
          allOf:
            - $ref: '#/components/schemas/DossierRef'
      required:
        - actionExpected
        - consent
        - dossier
        - encryptionKey
        - id
        - insuredPerson
        - lastMessageAt
        - lastMessageBy
        - objectType
        - participants
        - permissions
        - read
        - self
        - watch
    DossierConversationForCreation:
      type: object
      properties:
        objectType:
          description: Type of this object.
          type: string
          pattern: ^(TrioEvaluationIncapacityWorkConversation|TrioQuestionIncapacityWorkConversation|TrioWorkPotentialConversation|TrioReintegrationStartRequestConversation|TrioEvaluationHealthStatusConversation|TrioQuestionRtwFundConversation|TrioQuestionVocationalTrainingProjectConversation)$
          example: TrioEvaluationIncapacityWorkConversation
        encryptionKey:
          type: object
          description: Pseudonymised AES key to use to encrypt/decrypt the subject and the message.
          allOf:
            - $ref: '#/components/schemas/EncryptionKeyRefForCreation'
        message:
          type: string
          description: Encrypted text using the linked encryption key in a base64-encoded format
          format: byte
          example: U3dhZ2dlciByb2Nrcw==
        sender:
          type: object
          description: Conversation message sender.
          properties:
            givenName:
              type: string
            familyName:
              type: string
        participants:
          type: object
          description: list all conversation participants
          allOf:
            - $ref: '#/components/schemas/ConversationParticipantsCollectionForCreation'
        attachments:
          type: object
          description: Attachment linked to the conversation message
          allOf:
            - $ref: '#/components/schemas/AttachmentsCollectionForCreation'
        actionExpected:
          type: boolean
          description: flag indicating that an action is expected for the current actor
          example: false
        consent:
          type: boolean
          description: flag indicating the consent status. true when the insured person has given his consent for the exchange
            of data as part of this conversation. The user or organization must have proof of the consent.
          enum:
            - true
        dossier:
          description: Dossier linked to this conversation.
          allOf:
            - $ref: '#/components/schemas/DossierRefForCreation'
      required:
        - actionExpected
        - consent
        - dossier
        - encryptionKey
        - message
        - objectType
        - participants
    DossierConversationForUpdate:
      type: object
      properties:
        objectType:
          description: Type of this object.
          type: string
          pattern: ^(TrioEvaluationIncapacityWorkConversation|TrioQuestionIncapacityWorkConversation|TrioWorkPotentialConversation|TrioReintegrationStartRequestConversation|TrioEvaluationHealthStatusConversation|TrioQuestionRtwFundConversation|TrioQuestionVocationalTrainingProjectConversation)$
          example: TrioEvaluationIncapacityWorkConversation
        read:
          type: boolean
          description: Flag indicating that the conversation has been read by the current actor
          example: true
        actionExpected:
          type: boolean
          description: flag indicating that an action is expected for the current actor
          example: false
        watch:
          type: boolean
          description: "flag indicating that the conversation is visible in the current actor's overview. \n## Business rules:\
            \ - When set to *false*, The flag *actionExpected* is automatically set to *false* unless explicitly provided\
            \ in the request."
          example: true
        consent:
          type: boolean
          description: |-
            flag indicating the consent status.
            ## Business rules: - When set to *false*, no more messages or attachments can be added to this conversation.
      required:
        - objectType
