  /dossiersOwners:
    parameters:
      - $ref: '#/components/parameters/BelGovTraceId'
      - $ref: '#/components/parameters/TrioOrganizationId'
    get:
      tags:
        - Dossiers owners
      operationId: listDossierOwners
      summary: List actors type with owners for all dossiers available for requester organization
      parameters:
        - name: actor.id
          description: filter on an actor instead of requester's organization
          in: query
          required: false
          schema:
            type: string
            description: |
              Identifier of an actor.
              An actor can be identified either by:
              * __NIHDI number__ of a generalPractitioner : nihdiNumber:12345678
              * __ENTERPRISE number__ of an organization : enterpriseNumber:0123456789
              * technical __ID __  : id:d74ef6fb-e6ca-4fb3-9577-e831164f307a
            pattern: ^(nihdiNumber|enterpriseNumber|id):(.*)$
            example: nihdiNumber:12345678
          examples:
            id:00000000-0000-0000-0000-100000000001:
              value: id:00000000-0000-0000-0000-100000000001
              description: Dossiers owned by a specific actor
        - name: actor.hidden
          description: If provided, filter assignations on actor's hidden status
          in: query
          required: false
          schema:
            type: boolean
        - $ref: '#/components/parameters/InsuredPersonSsinQuery'
        - name: employer.enterpriseNumber
          description: filer by an insured person employer
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EnterpriseNumber'
        - name: showOnlyPartiallyAssigned
          description: only include dossiers that have a have some roles not assigned
          in: query
          required: false
          schema:
            type: boolean
        - name: showOnlyUnAssigned
          description: only include dossiers where no actors has been assigned
          in: query
          required: false
          schema:
            type: boolean
        - name: showOnlyAssignedToHiddenActors
          description: only include dossiers assigned to a hidden actor
          in: query
          required: false
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          description: Sorting properties. Use '-' as prefix to reverse the sorting
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^-?(?:actorType|dossier\.id|employer\.name|actor\.givenName|actor\.familyName)$
            uniqueItems: true
          examples:
            actorType:
              description: sort by actor type
              value:
                - actorType
            dossier.id:
              description: sort by dossier id
              value:
                - dossier.id
            employer.name:
              description: sort by employer name
              value:
                - employer.name
            actor.givenName,actor.familyName:
              description: sort by employer name
              value:
                - actor.givenName
                - actor.familyName
        - name: embed
          description: Resources to embed.
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^(?:items|items\((?:actor|actor\(organization\)|dossier|dossier\(insuredPerson\)|employers|employers\(items\))\))$
            uniqueItems: true
          examples:
            items:
              description: Embed the dossiers owners.
              value:
                - items
            items(actor):
              description: Embed the owner of the dossiers.
              value:
                - items(actor)
            items(actor(organization)):
              description: Embed the owner's organization of the dossiers.
              value:
                - items(actor)
            items(dossier):
              description: Embed the dossiers.
              value:
                - items(dossier)
            items(dossier(insuredPerson)):
              description: Embed the insured person linked to the dossier.
              value:
                - items(dossier(insuredPerson))
            items(employers), items(employers(items)):
              description: Embed the employers linked to the trajects.
              value:
                - items(employers)
                - items(employers(items))
      responses:
        '200':
          description: list of dossiers with owners matching the criterias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierOwnersCollection'
              example:
                self: https://api.ehealth.fgov.be/trio/v1/dossiersOwners?page=1&pageSize=10&embed=items&embed=items(actor)&embed=items(actor(organization))&embed=items(dossier)
