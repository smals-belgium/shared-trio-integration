  /dossiersOwners/assignDossiers:
    parameters:
      - $ref: '#/components/parameters/BelGovTraceId'
      - $ref: '#/components/parameters/TrioOrganizationId'
    post:
      tags:
        - Dossiers owners
      operationId: assignDossiers
      summary: Assign dossiers to actors
      description: Assign dossiers to one or more actors.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DossierOwnersCollectionForCreate'
      responses:
        '204':
          description: success
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /dossiersOwners/unassignDossiers:
    parameters:
      - $ref: '#/components/parameters/BelGovTraceId'
      - $ref: '#/components/parameters/TrioOrganizationId'
    post:
      tags:
        - Dossiers owners
      operationId: unassignDossiers
      summary: Unassign dossiers to actors
      description: Unassign dossiers to one or more actors.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DossierOwnersCollectionForCreate'
      responses:
        '204':
          description: success
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /employers:
    parameters:
      - $ref: '#/components/parameters/BelGovTraceId'
      - $ref: '#/components/parameters/TrioOrganizationId'
    get:
      tags:
        - Employers
      operationId: listEmployers
      summary: List all employers
      parameters:
        - $ref: '#/components/parameters/InsuredPersonSsinQuery'
        - name: externalService.id
          description: filter employers to return only the one managed by the given external service
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ActorId'
          examples:
            enterpriseNumber:0409122442:
              description: Return all employers managed by organization enterpriseNumber:0409122442
              value: enterpriseNumber:0409122442
        - name: name
          description: Employer name pattern to search
          in: query
          required: false
          schema:
            type: string
          examples:
            sma:
              description: Return all employers where  name contains sma*
              value: sma
        - name: embed
          description: Resources to embed in the response.
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^(?:items)$
            uniqueItems: true
          examples:
            items:
              description: Embed the employers.
              value:
                - items
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployersCollection'
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /employers/{enterpriseNumber}:
    parameters:
      - $ref: '#/components/parameters/BelGovTraceId'
      - $ref: '#/components/parameters/TrioOrganizationId'
    get:
      tags:
        - Employers
      operationId: consultEmployer
      summary: Consult details about an employer
      parameters:
        - name: enterpriseNumber
          description: The enterprise number associated to the employer
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/EnterpriseNumber'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employer'
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /encryptionKeys/{encryptionKeyId}:
    parameters:
      - $ref: '#/components/parameters/BelGovTraceId'
      - $ref: '#/components/parameters/TrioOrganizationId'
      - name: encryptionKeyId
        description: Identifier of this encryption key. Based on eHealth commons-v1.yaml#/definitions/Uuid.
        in: path
        required: true
        example: 91504de4-7f27-491e-96dc-5c8fefc4814f
        schema:
          $ref: '#/components/schemas/EncryptionKeyId'
    get:
      tags:
        - Encryption keys
      operationId: getEncryptionKey
      summary: Get an encryption key.
      description: Get an AES encryption key to use to encrypt/decrypt sensitive/medical information. The returned encryption
        key is pseudonymised.
      responses:
        '200':
          description: Pseudonymised AES key to use to encrypt/decrypt sensitive/medical information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptionKey'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /health:
    get:
      tags:
        - Monitoring
      operationId: checkHealth
      summary: Check health of the service
      responses:
        '200':
          $ref: '#/components/responses/HealthUpOrDegradedResponse'
        '503':
          $ref: '#/components/responses/HealthDownResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
      externalDocs:
        url: https://www.belgif.be/specification/rest/api-guide/#health
      security: []
  /insuredPersons:
    parameters:
      - $ref: '#/components/parameters/BelGovTraceId'
      - $ref: '#/components/parameters/TrioOrganizationId'
    post:
      tags:
        - Insured persons
      operationId: createInsuredPerson
      summary: Create a new insured person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsuredPersonForCreation'
      responses:
        '201':
          description: The created insured person.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsuredPerson'
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
            Location:
              $ref: '#/components/headers/Location'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /insuredPersons/{ssin}:{transitInfo}:
    parameters:
      - $ref: '#/components/parameters/BelGovTraceId'
      - $ref: '#/components/parameters/TrioOrganizationId'
      - $ref: '#/components/parameters/PseudonymisedSsin'
      - $ref: '#/components/parameters/TransitInfo'
    get:
      tags:
        - Insured persons
      operationId: consultInsuredPerson
      summary: Consult an insured person by pseudonymised SSIN
      parameters:
        - name: embed
          description: Resources to embed in the response.
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^(?:createdBy|encryptionKey|updatedBy)$
            uniqueItems: true
          examples:
            createdBy:
              description: Embed the actor that created the insured person.
              value:
                - createdBy
            encryptionKey:
              description: Embed the encryption key to use for the sub-resources of the insured person.
              value:
                - encryptionKey
            updatedBy:
              description: Embed the actor that did the last update of the insured person.
              value:
                - updatedBy
            createdBy,updatedBy:
              description: Embed the actors that created and updated the insured person.
              value:
                - createdBy
                - updatedBy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsuredPerson'
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /trajects:
    parameters:
      - $ref: '#/components/parameters/BelGovTraceId'
      - $ref: '#/components/parameters/TrioOrganizationId'
    get:
      tags:
        - Trajects
      operationId: searchTrajects
      summary: Search for trajects.
      parameters:
        - name: dossier.id
          description: Dossier id to filter on.
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/DossierId'
          example: 84031082-8d3c-485a-9bc9-ab895046c768
        - name: embed
          description: Resources to embed.
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^(?:items|items\((?:attachments|conversations|dossier|encryptionKey|employer|permissions|updatedBy|updatedBy\(organization\)|externalServices|externalServices\(items\)|externalServices\(items\(employers\)\)|externalServices\(items\(employers\(items\)\)\))\))$
            uniqueItems: true
          examples:
            items:
              description: Embed the trajects.
              value:
                - items
            items(attachments):
              description: Embed the attachments of the trajects.
              value:
                - items(attachments)
            items(dossier):
              description: Embed the dossiers linked to the trajects.
              value:
                - items(dossier)
            items(encryptionKey):
              description: Embed the encryptionKey.
              value:
                - items(encryptionKey)
            items(employer):
              description: Embed the employers linked to the trajects.
              value:
                - items(employer)
            items(conversations):
              description: Embed the conversations of the trajects.
              value:
                - items(conversations)
            items,items(dossier):
              description: Embed the trajects and their dossiers.
              value:
                - items
                - items(dossier)
            items(externalServices),items(externalServices(items)):
              description: Embed the external services responsible for each trajects
              value:
                - items(externalServices)
                - items(externalServices(items))
      responses:
        '200':
          description: Enumeration of the trajects matching the criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrajectsCollection'
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags:
        - Trajects
      operationId: createTraject
      summary: Create a new traject.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnyTrajectForCreation'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyTraject'
          headers:
            Location:
              $ref: '#/components/headers/Location'
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /trajects/{trajectId}:
    parameters:
      - $ref: '#/components/parameters/BelGovTraceId'
      - $ref: '#/components/parameters/TrioOrganizationId'
      - $ref: '#/components/parameters/TrajectId'
    get:
      tags:
        - Trajects
      operationId: consultTraject
      summary: Consult a traject
      parameters:
        - name: embed
          description: Resources to embed.
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^(?:attachments|dossier|encryptionKey|employer|conversations|permissions|updatedBy|updatedBy\(organization\)|externalServices|externalServices\(items\)|externalServices\(items\(employers\)\)|externalServices\(items\(employers\(items\)\)\))$
            uniqueItems: true
          examples:
            attachments:
              description: Embed the summaries of attachments linked to the traject.
              value:
                - attachments
            dossier:
              description: Embed the dossier linked to the traject.
              value:
                - dossier
            encryptionKey:
              description: Embed the encryptionKey.
              value:
                - encryptionKey
            employer:
              description: Embed the employer linked to the traject.
              value:
                - employer
            conversations:
              description: Embed the summaries of conversations linked to the traject.
              value:
                - conversations
            dossier,employer:
              description: Embed the dossier and the employer linked to the traject.
              value:
                - dossier
                - employer
            externalServices,externalServices(items):
              description: Embed the external services responsible for the traject
              value:
                - externalServices
                - externalServices(items)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyTraject'
        default:
          $ref: '#/components/responses/ProblemResponse'
    patch:
      tags:
        - Trajects
      operationId: updateTraject
      summary: Update a traject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnyTrajectForUpdate'
      responses:
        '200':
          description: Traject updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyTraject'
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags:
        - Trajects
      operationId: deleteTraject
      summary: Delete an empty traject.
      description: |-
        An empty traject is a traject without any attachments, conversations or dossier.
        Use this operation to delete a traject that has been created by mistake.
      responses:
        '204':
          description: No Content
          headers:
            BelGov-Related-Trace-Id:
              $ref: '#/components/headers/BelGovRelatedTraceId'
        default:
          $ref: '#/components/responses/ProblemResponse'
components:
  headers:
    BelGovRelatedTraceId:
      description: |-
        BelGov-Trace-Id value used on related request.
        Read https://www.belgif.be/specification/rest/api-guide/#tracing for more information.
      example: 00000000-0000-0000-0000-000000000000
      schema:
        type: string
        format: uuid
      allowEmptyValue: false
      required: true
    Location:
      description: The URI of the newly created resource.
      required: true
      schema:
        type: string
        format: uri
  parameters:
    ActorId:
      name: actorId
      description: Identifier of the actor.
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ActorId'
      examples:
        userByNihii:
          value: nihdiNumber:12345678
          summary: Using nihdi number as user's identifier
        organizationByEnterpriseNumber:
          value: enterpriseNumber:0123456789
          summary: Using CBE number as organization identifier
    AttachmentId:
      name: attachmentId
      description: Identifier of the attachment.
      in: path
      explode: false
      style: simple
      required: true
      schema:
        $ref: '#/components/schemas/AttachmentId'
    BelGovTraceId:
      name: BelGov-Trace-Id
      in: header
      description: |-
        Unique ID for tracing purposes, identifying the request.
        Should be unique.
        Usage of UUID is recommended.
        Read https://www.belgif.be/specification/rest/api-guide/#tracing for more information.
      example: 00000000-0000-0000-0000-000000000000
      schema:
        type: string
        format: uuid
      allowEmptyValue: false
      required: true
    ConversationId:
      name: conversationId
      description: Identifier of the conversation.
      in: path
      explode: false
      style: simple
      required: true
      schema:
        $ref: '#/components/schemas/ConversationId'
    DossierId:
      name: dossierId
      description: Identifier of the dossier.
      in: path
      explode: false
      style: simple
      required: true
      schema:
        $ref: '#/components/schemas/DossierId'
    DossierIdQuery:
      name: dossier.id
      description: Dossier id to filter on.
      example: 84031082-8d3c-485a-9bc9-ab895046c768
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/DossierId'
    InsuredPersonSsinQuery:
      name: insuredPerson.ssin
      description: SEC.1 Base64URL (without padding) representation of the point on the elliptic curve representing the pseudonymised
        insured person SSIN, followed by `:` and by a JWE containing the encrypted transitInfo.
      in: query
      schema:
        type: string
