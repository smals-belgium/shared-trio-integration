            description: |
              Identifier of an actor.
              An actor can be identified either by:
              * __NIHDI number__ of a generalPractitioner : nihdiNumber:12345678
              * __ENTERPRISE number__ of an organization : enterpriseNumber:0123456789
              * technical __ID __  : id:d74ef6fb-e6ca-4fb3-9577-e831164f307a
            pattern: ^(nihdiNumber|enterpriseNumber|id):(.*)$
            example: nihdiNumber:12345678
          examples:
            enterpriseNumber:0123456789:
              value: enterpriseNumber:0123456789
              description: Dossiers actions for an organization
            id:00000000-0000-0000-0000-100000000001:
              value: id:00000000-0000-0000-0000-100000000001
              description: Dossiers actions for a user
        - name: employer.enterpriseNumber
          description: filer by an insured person employer
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EnterpriseNumber'
        - name: by.id
          description: Filter to show only dossiers where the user was the last to take an action.
          in: query
          required: false
          schema:
            type: string
            description: |
              Identifier of an actor.
              An actor can be identified either by:
              * __NIHDI number__ of a generalPractitioner : nihdiNumber:12345678
              * __ENTERPRISE number__ of an organization : enterpriseNumber:0123456789
              * technical __ID __  : id:d74ef6fb-e6ca-4fb3-9577-e831164f307a
            pattern: ^(nihdiNumber|enterpriseNumber|id):(.*)$
            example: nihdiNumber:12345678
          examples:
            id:00000000-0000-0000-0000-100000000001:
              description: User identifier
              value: id:00000000-0000-0000-0000-100000000001
        - name: byMyRole.id
          description: Filter to show only dossiers assigned to a user having the same role as the requester.
          in: query
          required: false
          schema:
            type: string
            description: |
              Identifier of an actor.
              An actor can be identified either by:
              * __NIHDI number__ of a generalPractitioner : nihdiNumber:12345678
              * __ENTERPRISE number__ of an organization : enterpriseNumber:0123456789
              * technical __ID __  : id:d74ef6fb-e6ca-4fb3-9577-e831164f307a
            pattern: ^(nihdiNumber|enterpriseNumber|id):(.*)$
            example: nihdiNumber:12345678
          examples:
            id:00000000-0000-0000-0000-100000000001:
              description: User identifier
              value: id:00000000-0000-0000-0000-100000000001
        - name: embed
          description: Resources to embed.
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^(?:items|items\((?:dossier|by|byMyRole|employers|employers\(items\))\))$
